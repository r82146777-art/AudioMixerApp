name: Build and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: List APK
        run: find app/build/outputs -name "*.apk" || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioMixer-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90
          if-no-files-found: warn

      - name: Create Release with APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: میکسر صوتی - نسخه v1.0.${{ github.run_number }}
          body: |
            ## اپلیکیشن میکس صوتی آماده دانلود و نصب (نسخه اصلاح‌شده)

            **فایل APK را دانلود کنید و نصب کنید.**

            ### نحوه نصب:
            1. فایل `app-debug.apk` را دانلود کنید.
            2. در تنظیمات گوشی، «نصب از منابع ناشناس» یا «Allow from this source» را فعال کنید.
            3. فایل را باز کنید و نصب کنید.

            ### قابلیت‌های این نسخه:
            - انتخاب دو فایل صوتی (هر دو پایدار می‌مانند)
            - تنظیم ولوم هر فایل
            - اگر فایل پس‌زمینه کوتاه‌تر باشد، تا پایان فایل اصلی تکرار می‌شود
            - اگر فایل پس‌زمینه طولانی‌تر باشد، تا پایان فایل اصلی برش می‌خورد
            - پشتیبانی از فایل‌های طولانی (۱۰ دقیقه، ۳۰ دقیقه، ۱ ساعت و بیشتر)
            - پخش نتیجه و ذخیره در Downloads
            - پشتیبانی کامل TalkBack
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
